name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build publish directory
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          for path in \
            .nojekyll \
            404.html \
            index.html \
            ultra-sw.js \
            about \
            services \
            cases \
            contact \
            assets \
            _components \
            _json \
            _runtimes
          do
            if [ -e "$path" ]; then
              cp -a "$path" _site/
            fi
          done
          find _site \( -name ".DS_Store" -o -name "Thumbs.db" -o -name "desktop.ini" \) -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
