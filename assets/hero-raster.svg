      <stop offset=".46" stop-color="#1b5be2"/>
      <stop offset=".76" stop-color="#0d2c75"/>
      <stop offset="1" stop-color="#01040a"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
